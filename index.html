<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narya — Calendrier des publications</title>
<style>
  /* Charte Narya : Clay #C1573B · Pine #2E4034 · Gold #C79A56 · Sand #F3EBDD · Ink #211D1A */
  :root{
    --bg:#F3EBDD; --ink:#211D1A; --muted:#6f645a; --line:#dccfba; --soft:#eadfcc;
    --accent:#C1573B;
    --c-ig:#e1306c; --c-yt:#e00000; --c-tt:#111111; --c-fb:#1877f2;
    --clay:#C1573B; --gold:#C79A56; --pine:#2E4034;
    --t-ig:#b8235a; --t-yt:#c00000; --t-tt:#111111; --t-fb:#1264d0;
    --b-ig:#fbdce7; --b-yt:#fbdcd6; --b-tt:#ddd5c6; --b-fb:#d9e6fb;
    --ok-bg:#d2dcd2; --ok-fg:#2E4034;
    --err-bg:#efd3c8; --err-fg:#8e3a24;
    --serif:"Liberation Serif","Times New Roman",Times,serif;
    --sans:"Liberation Sans",Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1120px; margin:0 auto; padding:0 24px 44px}


  .nav{display:flex; gap:6px}
  .nav button{
    border:1px solid var(--line); background:transparent; color:var(--ink);
    height:32px; min-width:32px; padding:0 12px; border-radius:16px; font:600 12px var(--sans); cursor:pointer;
  }
  .nav button:hover{background:var(--soft)}
  button:focus-visible, .cell:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .hero{background:#211D1A; padding:26px 0}
  .hero-in{max-width:1120px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:16px}
  .hero-in svg{width:68px; height:57px; flex:none}
  .hero-name{font-family:var(--serif); font-size:40px; line-height:1; color:#F3EBDD; letter-spacing:.01em}
  .hero-sub{font-size:13px; color:#d6ccbc; margin-top:8px; letter-spacing:.02em}
  .titlebar{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:26px 0 4px}
  .eyebrow{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:6px}
  h1{margin:0; font-family:var(--serif); font-size:34px; line-height:1; font-weight:700; letter-spacing:-.01em}
  h1 #year{font-weight:400; color:var(--muted)}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 16px}
  .filters button{
    display:flex; align-items:center; gap:7px; height:30px; padding:0 12px 0 6px;
    border-radius:15px; border:1px solid var(--line); background:transparent; color:var(--ink);
    font:600 12px var(--sans); cursor:pointer;
  }
  .filters button.off{opacity:.4}
  .filters button.all{padding:0 14px}

  .ico{display:inline-flex; align-items:center; justify-content:center; flex:none; border-radius:30%; width:18px; height:18px; color:#fff}
  .ico svg{width:78%; height:78%}
  .ico.ig{background:linear-gradient(45deg,#feda75,#fa7e1e 30%,#d62976 60%,#4f5bd5)}
  .ico.tt{background:#000; box-shadow:0 0 0 1px var(--line)}
  .ico.yt{background:#ff0000}
  .ico.fb{background:#1877f2}

  .banner{background:var(--soft); border-radius:12px; padding:9px 12px; font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.4}
  .banner.err{background:var(--err-bg); color:var(--err-fg)}
  .banner[hidden]{display:none}

  .dow, .grid{display:grid; grid-template-columns:repeat(7,1fr)}
  .dow{border-bottom:1px solid var(--line); padding-bottom:6px}
  .dow span{text-align:center; font-size:11px; font-weight:700}
  .dow span:nth-child(n+6){color:var(--muted)}

  .cell{
    min-height:88px; padding:8px 2px 6px; border:0; border-bottom:1px solid var(--line);
    background:none; color:inherit; font:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0;
  }
  .cell.empty{cursor:default}
  .num{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:400; border:2px solid transparent;
  }
  .cell.we .num{color:var(--muted)}
  .cell.has .num{border-color:var(--ring, var(--ink)); background:color-mix(in srgb, var(--ring, var(--ink)) 10%, transparent)}
  .cell.today .num{background:var(--accent); border-color:var(--accent); color:#F3EBDD}
  .cell.sel .num{box-shadow:0 0 0 3px color-mix(in srgb, var(--ring, var(--ink)) 25%, transparent)}
  .cell:not(.empty):hover .num{background:var(--soft)}
  .cell.today:hover .num{background:var(--accent)}

  .chips{display:flex; flex-direction:column; gap:3px; width:100%; align-items:center}
  .chip{
    display:flex; align-items:center; gap:3px; max-width:100%;
    padding:2px 6px 2px 3px; border-radius:8px; font-size:10px; font-weight:700; line-height:1.2;
  }
  .chip .ico{width:13px; height:13px}
  .chip span.t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip.ig,.pill.ig{background:var(--b-ig); color:var(--t-ig)}
  .chip.yt,.pill.yt{background:var(--b-yt); color:var(--t-yt)}
  .chip.tt,.pill.tt{background:var(--b-tt); color:var(--t-tt)}
  .chip.fb,.pill.fb{background:var(--b-fb); color:var(--t-fb)}
  .more{font-size:10px; color:var(--muted); font-weight:700}

  .summary{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px}
  .pill{flex:1 1 calc(25% - 10px); min-width:170px; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:16px}
  .pill .ico{width:34px; height:34px}
  .pill b{font-family:var(--serif); font-size:28px; line-height:1; font-weight:700}
  .pill em{font-family:var(--serif); font-style:normal; font-size:16px; font-weight:700}
  .pill .lbl{display:flex; align-items:baseline; gap:8px; min-width:0; flex-wrap:wrap}
  .none{color:var(--muted); font-size:14px; padding:6px 2px}

  .detail{margin-top:24px; border-top:1px solid var(--line); padding-top:18px}
  .detail h2{font-family:var(--serif); font-size:22px; margin:0 0 12px; font-weight:700; text-transform:capitalize}
  .item{display:flex; gap:12px; align-items:center; padding:12px; background:var(--soft); border-radius:14px; margin-bottom:8px}
  .item .ico{width:34px; height:34px}
  .item .tx{flex:1; min-width:0}
  .item .l1{font-weight:700; font-size:14px}
  .item .l2{font-size:12px; color:var(--muted); margin-top:2px}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; background:var(--line); white-space:nowrap}
  .badge.ok{background:var(--ok-bg); color:var(--ok-fg)}
  .item a{color:var(--accent); font-size:12px; font-weight:700; text-decoration:none; white-space:nowrap}

  .foot{margin-top:24px; display:flex; justify-content:space-between; gap:10px; font-size:11px; color:var(--muted)}
  .foot button{border:0; background:none; color:var(--accent); font:700 11px var(--sans); cursor:pointer; padding:0}

  .sheet-bg{position:fixed; inset:0; background:rgba(20,16,13,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50}
  .sheet-bg[hidden]{display:none}
  .sheet{width:100%; max-width:600px; max-height:84vh; overflow:auto; background:var(--bg); border-radius:24px 24px 0 0; padding:20px 16px 30px; box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px}
  .sheet-head h2{font-family:var(--serif); font-size:20px; line-height:1.1; margin:0; text-transform:capitalize}
  .sheet-head .sub{font-size:12px; color:var(--muted); margin-top:4px}
  .sheet-head button{border:1px solid var(--line); background:transparent; color:var(--ink); width:36px; height:36px; border-radius:50%; font-size:15px; cursor:pointer; flex:none}
  .grp{display:flex; align-items:center; gap:8px; margin:16px 0 8px; font-weight:700; font-size:13px}
  .grp.ig{color:var(--t-ig)} .grp.tt{color:var(--t-tt)} .grp.yt{color:var(--t-yt)} .grp.fb{color:var(--t-fb)}
  .grp .n{margin-left:auto; font-size:12px; padding:2px 9px; border-radius:10px}
  .grp.ig .n{background:var(--b-ig)} .grp.tt .n{background:var(--b-tt)} .grp.yt .n{background:var(--b-yt)} .grp.fb .n{background:var(--b-fb)}
  .item .l1{font-size:14px}
  .cfg{margin-top:16px; padding:14px; background:var(--soft); border-radius:14px}
  .cfg[hidden]{display:none}
  .cfg label{display:block; font-size:12px; font-weight:700; margin-bottom:8px}
  .cfg input{width:100%; height:40px; border:1px solid var(--line); border-radius:10px; padding:0 12px; background:var(--bg); color:var(--ink); font:13px var(--sans)}
  .cfg .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .cfg .row button{height:36px; padding:0 16px; border-radius:18px; border:1px solid var(--line); background:transparent; color:var(--ink); font:700 13px var(--sans); cursor:pointer}
  .cfg .row button.main{background:var(--accent); border-color:var(--accent); color:#F3EBDD}
  .cfg p{margin:10px 0 0; font-size:12px; color:var(--muted); line-height:1.5}
  .foot .acts{display:flex; gap:14px}

  @media (max-width:380px){
    h1{font-size:28px}
    .num{width:26px; height:26px; font-size:13px}
    .chip{font-size:10px}
    .hero-name{font-size:32px}
    .hero-in svg{width:54px; height:45px}
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <svg viewBox="12 4 96 80" aria-hidden="true">
      <g transform="translate(60 52)">
        <ellipse cx="0" cy="-22" rx="12" ry="21" fill="#B8553B"/>
        <ellipse cx="0" cy="-22" rx="12" ry="21" fill="#C39556" transform="rotate(240)"/>
        <ellipse cx="0" cy="-22" rx="12" ry="21" fill="#5B7B67" transform="rotate(120)"/>
        <circle r="4.6" fill="#F3EBDD"/>
      </g>
    </svg>
    <div class="hero-tx">
      <div class="hero-name">narya</div>
      <div class="hero-sub">Agence de marketing d'influence</div>
    </div>
  </div>
</header>

<div class="app">
  <div class="titlebar">
    <div>
      <div class="eyebrow">Calendrier de contenu</div>
      <h1><span id="month"></span> <span id="year"></span></h1>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Mois précédent">‹</button>
      <button id="todayBtn">Aujourd'hui</button>
      <button id="next" aria-label="Mois suivant">›</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="banner" id="banner" hidden></div>

  <div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
  <div class="grid" id="grid"></div>

  <div class="sheet-bg" id="sheetBg" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <div><h2 id="sheetTitle"></h2><div class="sub" id="sheetSub"></div></div>
        <button id="sheetClose" aria-label="Fermer">✕</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="cfg" id="cfg" hidden>
    <label for="url">Lien CSV du Google Sheet publié</label>
    <input id="url" type="url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" autocomplete="off">
    <div class="row">
      <button class="main" id="saveUrl">Enregistrer</button>
      <button id="resetUrl">Revenir à la démo</button>
    </div>
    <p>Google Sheet : Fichier &gt; Partager &gt; Publier sur le Web &gt; feuille « Publications » &gt; format CSV &gt; Publier. Le lien est gardé dans ce navigateur.</p>
  </div>

  <div class="foot">
    <span id="status"></span>
    <div class="acts">
      <button id="cfgBtn">Sheet</button>
      <button id="refresh">Actualiser</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   1) COLLE ICI le lien CSV de ton Google Sheet publié
   (Fichier > Partager > Publier sur le Web > CSV)
   Si c'est vide, la page affiche des données de démo.
   ===================================================== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT3oqSZC8Sx7rDfYI6WlUnFHR52aZmgHeRIEP0JBzg6aDNhPZEYs_Nuc90YEoBWGg/pub?gid=1186417156&single=true&output=csv";   // facultatif : tu peux aussi le coller dans la page (bouton « Sheet »)

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||""; if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){ return ""; } }
function sheetUrl(){ return store("narya_cal_url") || SHEET_CSV_URL; }

/* Actualisation automatique (minutes). 0 = désactivée */
const AUTO_REFRESH_MIN = 5;

const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

const PLATFORMS = {
  ig:{ name:"Instagram", color:"var(--c-ig)", glyph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="4.5" width="15" height="15" rx="4.5"/><circle cx="12" cy="12" r="3.4"/><circle cx="16.8" cy="7.2" r=".6" fill="currentColor"/></svg>' },
  tt:{ name:"TikTok", color:"var(--c-tt)", glyph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5v9.2a3.2 3.2 0 1 1-2.6-3.1"/><path d="M14 5c.3 2.1 1.8 3.5 4 3.7"/></svg>' },
  yt:{ name:"YouTube", color:"var(--c-yt)", glyph:'<svg viewBox="0 0 24 24"><polygon points="9.5,7.5 17,12 9.5,16.5" fill="currentColor"/></svg>' },
  fb:{ name:"Facebook", color:"var(--c-fb)", glyph:'<svg viewBox="0 0 24 24"><path d="M13.6 20v-6.9h2.3l.4-2.8h-2.7V8.6c0-.8.3-1.4 1.4-1.4h1.4V4.7c-.3 0-1.1-.1-2.1-.1-2.1 0-3.5 1.3-3.5 3.6v2.1H8.5v2.8h2.3V20z" fill="currentColor"/></svg>' }
};
const ORDER = ["ig","tt","yt","fb"];

/* ---------- Données de démo ---------- */
const DEMO = [
  {date:"2026-10-07", plateforme:"Instagram", type:"Story", marque:"Pansy", influenceur:"@nour.beauty", statut:"Publié", lien:""},
  {date:"2026-10-10", plateforme:"Instagram", type:"Story", marque:"Sabrinel", influenceur:"@lina.dz", statut:"Planifié", lien:""},
  {date:"2026-10-12", plateforme:"Instagram", type:"Story", marque:"Pansy", influenceur:"@nour.beauty", statut:"Planifié", lien:""},
  {date:"2026-10-12", plateforme:"Instagram", type:"Story", marque:"Pansy", influenceur:"@sara.mum", statut:"Planifié", lien:""},
  {date:"2026-10-12", plateforme:"Instagram", type:"Story", marque:"Pansy", influenceur:"@lina.dz", statut:"Planifié", lien:""},
  {date:"2026-10-12", plateforme:"TikTok", type:"Vidéo", marque:"ETINIA", influenceur:"@yasmine.tv", statut:"Planifié", lien:""},
  {date:"2026-10-14", plateforme:"Instagram", type:"Reel", marque:"ALIX AVIEN", influenceur:"@amel.style", statut:"Planifié", lien:""},
  {date:"2026-10-15", plateforme:"YouTube", type:"Vidéo", marque:"Sabrinel", influenceur:"@maman.dz", statut:"Planifié", lien:""},
  {date:"2026-10-15", plateforme:"YouTube", type:"Vidéo", marque:"Sabrinel", influenceur:"@rim.vlog", statut:"Planifié", lien:""},
  {date:"2026-10-15", plateforme:"TikTok", type:"Vidéo", marque:"Sabrinel", influenceur:"@ines.kids", statut:"Planifié", lien:""},
  {date:"2026-10-17", plateforme:"Instagram", type:"Story", marque:"Pansy", influenceur:"@nour.beauty", statut:"Planifié", lien:""},
  {date:"2026-10-17", plateforme:"Facebook", type:"Post", marque:"Pansy", influenceur:"Page Pansy", statut:"Planifié", lien:""},
  {date:"2026-10-21", plateforme:"TikTok", type:"Vidéo", marque:"baby.powderparis", influenceur:"@ines.kids", statut:"Planifié", lien:""},
  {date:"2026-10-23", plateforme:"YouTube", type:"Short", marque:"ETINIA", influenceur:"@rim.vlog", statut:"Planifié", lien:""},
  {date:"2026-10-28", plateforme:"Facebook", type:"Reel", marque:"ALIX AVIEN", influenceur:"Page ALIX AVIEN", statut:"Planifié", lien:""}
];

/* ---------- Utilitaires ---------- */
const $ = id => document.getElementById(id);
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const pad = n => String(n).padStart(2,"0");
const keyOf = (y,m,d) => y+"-"+pad(m+1)+"-"+pad(d);

function h(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function icon(p){
  const s = h("span","ico "+p);
  s.innerHTML = PLATFORMS[p].glyph; // contenu fixe, pas issu du Sheet
  return s;
}

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"'; i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){ row.push(cur); cur=""; }
      else if(c==="\n"||c==="\r"){
        if(c==="\r" && text[i+1]==="\n") i++;
        row.push(cur); cur="";
        if(row.some(x=>x.trim()!=="")) rows.push(row);
        row=[];
      } else cur+=c;
    }
  }
  row.push(cur);
  if(row.some(x=>x.trim()!=="")) rows.push(row);
  return rows;
}

function parseDate(s){
  s = String(s||"").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return {y:+m[1], m:+m[2]-1, d:+m[3]};
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return {y, m:+m[2]-1, d:+m[1]}; }
  return null;
}

function platformOf(s){
  const v = norm(s);
  if(v.includes("insta") || v==="ig") return "ig";
  if(v.includes("tik")) return "tt";
  if(v.includes("you") || v==="yt") return "yt";
  if(v.includes("face") || v==="fb") return "fb";
  return null;
}

function toPosts(objs){
  const out=[]; let skipped=0;
  for(const o of objs){
    const dt = parseDate(o.date);
    const p = platformOf(o.plateforme);
    if(!dt || !p){ skipped++; continue; }
    const type = (o.type||"").trim() || "Post";
    out.push({
      key:keyOf(dt.y,dt.m,dt.d), y:dt.y, m:dt.m, d:dt.d, p,
      type: type.charAt(0).toUpperCase()+type.slice(1),
      marque:(o.marque||"").trim(), influenceur:(o.influenceur||"").trim(),
      statut:(o.statut||"").trim(), lien:(o.lien||"").trim()
    });
  }
  return {posts:out, skipped};
}

function csvToObjs(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const head = rows[0].map(norm);
  const idx = name => head.findIndex(x => x===name);
  const col = {
    date: idx("date"), plateforme: idx("plateforme"), type: idx("type"), marque: idx("marque"),
    influenceur: idx("influenceur"), statut: idx("statut"), lien: idx("lien")
  };
  return rows.slice(1).map(r => ({
    date: r[col.date], plateforme: r[col.plateforme], type: col.type>=0?r[col.type]:"",
    marque: col.marque>=0?r[col.marque]:"", influenceur: col.influenceur>=0?r[col.influenceur]:"",
    statut: col.statut>=0?r[col.statut]:"", lien: col.lien>=0?r[col.lien]:""
  }));
}

/* ---------- État ---------- */
const now = new Date();
const state = {
  y: now.getFullYear(), m: now.getMonth(),
  active: new Set(ORDER),
  posts: [], byDate: {}, sel: null, open: false, loadedAt: null
};

function index(){
  state.byDate = {};
  for(const p of state.posts) (state.byDate[p.key] = state.byDate[p.key] || []).push(p);
}

async function load(){
  const banner = $("banner");
  banner.hidden = true; banner.className = "banner";
  let skipped = 0;

  const URL_CSV = sheetUrl();
  if(!URL_CSV){
    const r = toPosts(DEMO);
    state.posts = r.posts;
    banner.hidden = false;
    banner.textContent = "Mode démo : colle le lien CSV de ton Google Sheet avec le bouton « Sheet » en bas de la page pour voir tes vraies publications.";
  } else {
    try{
      const sep = URL_CSV.includes("?") ? "&" : "?";
      const res = await fetch(URL_CSV + sep + "t=" + Date.now());
      if(!res.ok) throw new Error("HTTP " + res.status);
      const r = toPosts(csvToObjs(await res.text()));
      state.posts = r.posts; skipped = r.skipped;
      if(skipped){
        banner.hidden = false;
        banner.textContent = skipped + " ligne(s) ignorée(s) : date ou plateforme non reconnue.";
      }
    }catch(e){
      banner.hidden = false; banner.className = "banner err";
      banner.textContent = "Impossible de lire le Google Sheet. Vérifie qu'il est publié sur le Web au format CSV et que le lien est correct.";
    }
  }
  state.loadedAt = new Date();
  index();
  render();
}

/* ---------- Rendu ---------- */
function visibleOn(key){
  return (state.byDate[key]||[]).filter(p => state.active.has(p.p));
}

function renderFilters(){
  const f = $("filters"); f.textContent = "";
  const all = h("button","all","Toutes");
  all.onclick = () => { state.active = new Set(ORDER); render(); };
  if(state.active.size !== ORDER.length) all.classList.add("off");
  f.append(all);
  for(const p of ORDER){
    const b = h("button", state.active.has(p) ? "" : "off");
    b.append(icon(p), document.createTextNode(PLATFORMS[p].name));
    b.setAttribute("aria-pressed", state.active.has(p));
    b.onclick = () => {
      if(state.active.size === ORDER.length) state.active = new Set([p]);
      else if(state.active.has(p)){ state.active.delete(p); if(!state.active.size) state.active = new Set(ORDER); }
      else state.active.add(p);
      render();
    };
    f.append(b);
  }
}

function renderGrid(){
  const MAXC = window.innerWidth > 700 ? 3 : 2;
  const g = $("grid"); g.textContent = "";
  const first = new Date(state.y, state.m, 1);
  const lead = (first.getDay()+6) % 7;
  const days = new Date(state.y, state.m+1, 0).getDate();
  for(let i=0;i<lead;i++){ g.append(h("div","cell empty")); }

  const todayKey = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
  for(let d=1; d<=days; d++){
    const key = keyOf(state.y, state.m, d);
    const posts = visibleOn(key);
    const dow = (lead + d - 1) % 7;
    const c = h("button","cell");
    if(dow >= 5) c.classList.add("we");
    if(key === todayKey) c.classList.add("today");
    if(key === state.sel) c.classList.add("sel");

    const plats = [...new Set(posts.map(p=>p.p))];
    if(posts.length){
      c.classList.add("has");
      c.style.setProperty("--ring", plats.length===1 ? PLATFORMS[plats[0]].color : "var(--ink)");
    }
    c.append(h("div","num", d));

    if(posts.length){
      const groups = {};
      for(const p of posts){
        const k = p.p+"|"+p.type;
        groups[k] = groups[k] || {p:p.p, type:p.type, n:0};
        groups[k].n++;
      }
      const list = Object.values(groups).sort((a,b)=>ORDER.indexOf(a.p)-ORDER.indexOf(b.p));
      const box = h("div","chips");
      for(const gr of list.slice(0,MAXC)){
        const chip = h("div","chip "+gr.p);
        chip.append(icon(gr.p), h("span","t", gr.type + (gr.n>1 ? " ×"+gr.n : "")));
        box.append(chip);
      }
      if(list.length>MAXC) box.append(h("div","more","+"+(list.length-MAXC)));
      c.append(box);
    }
    c.setAttribute("aria-label", d+" "+MONTHS[state.m]+(posts.length ? ", "+posts.length+" publication(s)" : ""));
    c.onclick = () => { state.sel = key; state.open = true; render(); $("sheetClose").focus(); };
    g.append(c);
  }
}

function renderDetail(){
  const bg = $("sheetBg");
  if(!state.sel || !state.open){ bg.hidden = true; document.body.style.overflow = ""; return; }
  bg.hidden = false; document.body.style.overflow = "hidden";
  const [y,m,d] = state.sel.split("-").map(Number);
  $("sheetTitle").textContent = new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"});
  const posts = visibleOn(state.sel);
  const names = new Set(posts.map(p=>p.influenceur).filter(Boolean));
  $("sheetSub").textContent = posts.length
    ? posts.length+" publication"+(posts.length>1?"s":"")+" · "+names.size+" influenceur"+(names.size>1?"s":"")
    : "";
  const box = $("sheetBody"); box.textContent = "";
  if(!posts.length){ box.append(h("div","none","Rien de prévu ce jour-là.")); return; }

  const groups = {};
  for(const p of posts){
    const k = p.p+"|"+p.type;
    (groups[k] = groups[k] || {p:p.p, type:p.type, items:[]}).items.push(p);
  }
  const list = Object.values(groups).sort((a,b)=>ORDER.indexOf(a.p)-ORDER.indexOf(b.p));
  for(const gr of list){
    const head = h("div","grp "+gr.p);
    head.append(icon(gr.p), h("span","", PLATFORMS[gr.p].name+" · "+gr.type), h("span","n", gr.items.length));
    box.append(head);
    for(const p of gr.items){
      const it = h("div","item");
      const tx = h("div","tx");
      tx.append(h("div","l1", p.influenceur || "(nom non renseigné)"));
      if(p.marque) tx.append(h("div","l2", p.marque));
      it.append(tx);
      if(p.statut){
        const ok = /publi|post|fait|done/.test(norm(p.statut)) && !/non|pas/.test(norm(p.statut));
        it.append(h("span","badge"+(ok?" ok":""), p.statut));
      }
      if(/^https?:\/\//i.test(p.lien)){
        const a = h("a","","Voir");
        a.href = p.lien; a.target = "_blank"; a.rel = "noopener noreferrer";
        it.append(a);
      }
      box.append(it);
    }
  }
}

function render(){
  $("year").textContent = state.y;
  $("month").textContent = MONTHS[state.m];
  renderFilters(); renderGrid(); renderDetail();
  $("status").textContent = state.loadedAt
    ? "Mis à jour à " + state.loadedAt.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "";
}

/* ---------- Événements ---------- */
$("prev").onclick = () => { state.m--; if(state.m<0){state.m=11; state.y--;} state.sel=null; state.open=false; render(); };
$("next").onclick = () => { state.m++; if(state.m>11){state.m=0; state.y++;} state.sel=null; state.open=false; render(); };
$("todayBtn").onclick = () => {
  state.y = now.getFullYear(); state.m = now.getMonth();
  state.sel = keyOf(now.getFullYear(), now.getMonth(), now.getDate()); state.open = false; render();
};
$("refresh").onclick = load;
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
const closeSheet = () => { state.open = false; render(); };
$("sheetClose").onclick = closeSheet;
$("sheetBg").onclick = e => { if(e.target === $("sheetBg")) closeSheet(); };
document.addEventListener("keydown", e => { if(e.key === "Escape" && state.open) closeSheet(); });

$("cfgBtn").onclick = () => { const c=$("cfg"); c.hidden=!c.hidden; if(!c.hidden){ $("url").value = sheetUrl(); $("url").focus(); } };
$("saveUrl").onclick = () => { store("narya_cal_url", $("url").value.trim()); $("cfg").hidden=true; load(); };
$("resetUrl").onclick = () => { store("narya_cal_url",""); $("url").value=""; $("cfg").hidden=true; load(); };



state.sel = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
load();
if(AUTO_REFRESH_MIN > 0) setInterval(load, AUTO_REFRESH_MIN*60*1000);
</script>
</body>
</html>
